# /etc/raven/raven.conf: every option is listed under "Configuration" in the README.
# The certificate comes from the systemd unit (contrib/raven.service).
hostname = mail.example.com
# "::" also accepts IPv4 on Linux.
listen_address = 0.0.0.0
listen_port = 25
submission_port = 587
smtps_port = 465
imap_port = 143
imaps_port = 993
data_dir = /var/lib/raven
log_level = info
